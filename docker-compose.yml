services:
    postgres:
        image: postgres:15
        container_name: discord-bot-postgres
        volumes:
            - postgres_data:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        networks:
            infrastructure-net:
                aliases:
                    - postgres
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-discord_bot}',
                ]
            interval: 30s
            timeout: 10s
            retries: 3

    discord-bot:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: discord-bot-app
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            DATABASE_URL: ${DATABASE_URL}
            DISCORD_TOKEN: ${DISCORD_TOKEN}
        networks:
            - infrastructure-net
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

volumes:
    postgres_data:

networks:
    infrastructure-net:
        external: true
